# Dev image workflow: builds and pushes :dev and :latest tagged images on
# pushes to master that touch application source, dependencies, or the
# Dockerfile. No GitHub Release is created.
#
# Produces:
#   - Container images tagged :dev and :latest on GHCR and Docker Hub
#     (linux/amd64).
#
# The :latest tag is pushed here so that docker pull ...:latest always
# works, even before any release tag is created. When a release tag (v*)
# is pushed, the release workflow overwrites :latest with the released
# version.
#
# Triggered only by changes that can affect image content; docs-only
# pushes do not rebuild. Use workflow_dispatch to force a rebuild (e.g.
# after a base image refresh).
#
# Required secrets for Docker Hub (GHCR uses the automatic GITHUB_TOKEN):
#   DOCKERHUB_USERNAME - Docker Hub account name.
#   DOCKERHUB_TOKEN    - Docker Hub access token (not the password).
# Optional repository variable:
#   DOCKERHUB_IMAGE    - Docker Hub image name (default overklassniy/md2pdf).
name: dev-image

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/dev-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push dev image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Attestation manifests wrap the pushed tag in an OCI image index;
      # GHCR and Docker Hub read the package description from index-level
      # annotations, not from the image config labels, so the OCI labels
      # are repeated here as annotations.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:latest
            docker.io/${{ vars.DOCKERHUB_IMAGE || 'overklassniy/md2pdf' }}:dev
            docker.io/${{ vars.DOCKERHUB_IMAGE || 'overklassniy/md2pdf' }}:latest
          annotations: |
            index,manifest:org.opencontainers.image.title=md2pdf
            index,manifest:org.opencontainers.image.description=Offline Markdown to PDF: edit, preview and print to PDF in the browser
            index,manifest:org.opencontainers.image.url=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            index,manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.authors=${{ github.repository_owner }}
            index,manifest:org.opencontainers.image.vendor=${{ github.repository_owner }}
            index,manifest:org.opencontainers.image.licenses=MIT
            index,manifest:org.opencontainers.image.version=dev
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ steps.date.outputs.value }}
            index,manifest:org.opencontainers.image.base.name=ghcr.io/static-web-server/static-web-server:2
          cache-from: type=gha
          cache-to: type=gha,mode=max
