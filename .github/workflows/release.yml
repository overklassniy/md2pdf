# Release workflow: re-runs the test suite as a gate, then builds and
# publishes the Docker image to GHCR and Docker Hub.
#
# Triggers on git tags matching v* (e.g. v1.0.0, v1.2.3-rc1).
# Produces:
#   - Container images tagged :<version>, :<major>, :<major>.<minor>,
#     and :latest on both registries (linux/amd64).
#   - No GitHub Release object is created; the tag itself is the release.
#
# Required secrets for Docker Hub (GHCR uses the automatic GITHUB_TOKEN):
#   DOCKERHUB_USERNAME - Docker Hub account name.
#   DOCKERHUB_TOKEN    - Docker Hub access token (not the password).
# Optional repository variable:
#   DOCKERHUB_IMAGE    - Docker Hub image name (default overklassniy/md2pdf).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write   # push to GHCR.

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  docker:
    name: Build and push release image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ vars.DOCKERHUB_IMAGE || 'overklassniy/md2pdf' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Attestation manifests wrap the pushed tag in an OCI image index;
      # GHCR and Docker Hub read the package description from index-level
      # annotations, not from the image config labels, so the OCI labels
      # are repeated here as annotations.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index,manifest:org.opencontainers.image.title=md2pdf
            index,manifest:org.opencontainers.image.description=Offline Markdown to PDF: edit, preview and print to PDF in the browser
            index,manifest:org.opencontainers.image.url=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme
            index,manifest:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index,manifest:org.opencontainers.image.authors=${{ github.repository_owner }}
            index,manifest:org.opencontainers.image.vendor=${{ github.repository_owner }}
            index,manifest:org.opencontainers.image.licenses=MIT
            index,manifest:org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            index,manifest:org.opencontainers.image.revision=${{ github.sha }}
            index,manifest:org.opencontainers.image.created=${{ steps.date.outputs.value }}
            index,manifest:org.opencontainers.image.base.name=ghcr.io/static-web-server/static-web-server:2
          cache-from: type=gha
          cache-to: type=gha,mode=max
